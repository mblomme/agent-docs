name: Sync GitHub plugin marketplace.json

on:
  push:
    branches:
      - '**'
    paths:
      - '.agents/plugins/marketplace.json'
      - '.github/plugin/marketplace.json'
      - 'plugins/*/plugin.json'

permissions:
  contents: write

jobs:
  sync-marketplace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Generate .github/plugin/marketplace.json from .agents/plugins/marketplace.json
        id: sync
        env:
          REPO_OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p .github/plugin
          python3 - << 'EOF'
          import json
          import os
          from pathlib import Path

          src = json.loads(Path(".agents/plugins/marketplace.json").read_text(encoding="utf-8"))
          dst_path = Path(".github/plugin/marketplace.json")
          existing = json.loads(dst_path.read_text(encoding="utf-8")) if dst_path.exists() else {}

          owner_name = os.environ.get("REPO_OWNER") or existing.get("owner", {}).get("name") or "mblomme"
          plugins = []
          for entry in src.get("plugins", []):
              source = entry.get("source")
              if isinstance(source, dict) and source.get("source") == "local" and "path" in source:
                  source_path = source["path"]
              else:
                  source_path = source

              plugin_entry = {
                  "name": entry["name"],
                  "source": source_path,
              }

              if isinstance(source_path, str):
                  manifest_path = Path(source_path) / "plugin.json"
                  if manifest_path.is_file():
                      manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
                      if "description" in manifest:
                          plugin_entry["description"] = manifest["description"]
                      if "version" in manifest:
                          plugin_entry["version"] = manifest["version"]

              for key in ("description", "version"):
                  if key not in plugin_entry and key in entry:
                      plugin_entry[key] = entry[key]

              plugins.append(plugin_entry)

          out = {
              "name": src["name"],
              "owner": {"name": owner_name},
              "metadata": existing.get(
                  "metadata",
                  {"description": "Reusable agent plugins for software design and development."},
              ),
              "plugins": plugins,
          }

          rendered = json.dumps(out, indent=2) + "\n"
          if not dst_path.exists() or dst_path.read_text(encoding="utf-8") != rendered:
              dst_path.write_text(rendered, encoding="utf-8")
              changed = "true"
          else:
              changed = "false"

          github_output = os.environ.get("GITHUB_OUTPUT")
          if github_output:
              with open(github_output, "a", encoding="utf-8") as f:
                  f.write(f"changed={changed}\n")
          EOF

      - name: Commit and push synced .github/plugin/marketplace.json
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/plugin/marketplace.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync .github/plugin/marketplace.json from .agents/plugins/marketplace.json [skip ci]"
            git push origin "HEAD:${{ github.ref }}"
          fi
