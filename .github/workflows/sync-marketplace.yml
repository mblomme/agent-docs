name: Sync root marketplace.json

on:
  push:
    branches:
      - '**'
    paths:
      - '.agents/plugins/marketplace.json'
      - 'marketplace.json'

permissions:
  contents: write

jobs:
  sync-marketplace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Replace marketplace.json symlink with real copy
        id: sync
        run: |
          if [ -L marketplace.json ] || ! cmp -s .agents/plugins/marketplace.json marketplace.json; then
            rm -f marketplace.json
            cp .agents/plugins/marketplace.json marketplace.json
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push synced marketplace.json
        if: steps.sync.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add marketplace.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: sync root marketplace.json from .agents/plugins/marketplace.json [skip ci]"
            git push origin "HEAD:${{ github.ref }}"
          fi
